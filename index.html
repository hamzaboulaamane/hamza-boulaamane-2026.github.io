<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HamzaOS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Desktop -->
<div id="desktop">

  <div class="icon" ondblclick="openWindow('about')">
    <img src="https://img.icons8.com/fluency/48/user.png">
    <span>About</span>
  </div>

  <div class="icon" ondblclick="openWindow('projects')">
    <img src="https://img.icons8.com/fluency/48/folder-invoices.png">
    <span>Projects</span>
  </div>

  <div class="icon" ondblclick="openWindow('certificates')">
    <img src="https://img.icons8.com/fluency/48/certificate.png">
    <span>Certificates</span>
  </div>

  <div class="icon" ondblclick="openWindow('contact')">
    <img src="https://img.icons8.com/fluency/48/new-post.png">
    <span>Contact</span>
  </div>

  <!-- Terminal Icon -->
  <div class="icon" ondblclick="openWindow('terminal')">
    <img src="https://img.icons8.com/fluency/48/console.png">
    <span>Terminal</span>
  </div>

</div>

<!-- Windows Container -->
<div id="windows"></div>

<!-- Hidden Terminal Template -->
<template id="terminal-template">
  <div class="terminal">
    <div id="output">
      <p>HamzaOS v1.0</p>
      <p>Type <span class="cmd">help</span> to get started.</p>
    </div>

    <div class="input-line">
      <span class="prompt">hamza@portfolio:~$</span>
      <input type="text" id="command" />
    </div>
  </div>
</template>

<!-- Taskbar -->
<div id="taskbar">
  <div id="tasks"></div>
  <div id="clock"></div>
</div>
case "contact":
  return `
    <h3>Contact Me</h3>
    <ul>
      <li><a href="https://github.com/YOUR_USERNAME" target="_blank">GitHub</a></li>
      <li><a href="https://www.linkedin.com/in/YOUR_USERNAME/" target="_blank">LinkedIn</a></li>
      <li><a href="mailto:your@email.com">Email</a></li>
    </ul>
  `;
  <div class="icon" ondblclick="window.open('https://github.com/YOUR_USERNAME','_blank')">
  <img src="https://img.icons8.com/fluency/48/github.png">
  <span>GitHub</span>
</div>

<div class="icon" ondblclick="window.open('https://www.linkedin.com/in/YOUR_USERNAME/','_blank')">
  <img src="https://img.icons8.com/fluency/48/linkedin.png">
  <span>LinkedIn</span>
</div>

<script src="script.js"></script>
</body>
</html>
