<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HamzaOS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Desktop -->
<div id="desktop">
  <div class="icon" data-window="about">
    <span>About</span>
  </div>

  <div class="icon" data-window="projects">
    <img src="https://img.icons8.com/fluency/48/folder-invoices.png">
    <span>Projects</span>
  </div>

  <div class="icon" data-window="certificates">
    <img src="https://img.icons8.com/fluency/48/certificate.png">
    <span>Certificates</span>
  </div>

  <div class="icon" data-window="contact">
    <img src="https://img.icons8.com/fluency/48/new-post.png">
    <span>Contact</span>
  </div>

  <div class="icon" data-window="terminal">
    <img src="https://img.icons8.com/fluency/48/console.png">
    <span>Terminal</span>
  </div>

  <!-- Social Links -->
  <div class="icon" onclick="window.open('https://github.com/hamzaboulaamane', '_blank')">
    <img src="https://img.icons8.com/fluency/48/github.png">
    <span>GitHub</span>
  </div>

  <div class="icon" onclick="window.open('https://www.linkedin.com/in/hamza-boulaamane-34bab4269/', '_blank')">
    <img src="https://img.icons8.com/fluency/48/linkedin.png">
    <span>LinkedIn</span>
  </div>
</div>

<!-- Windows Container -->
<div id="windows"></div>

<!-- Terminal Template -->
<template id="terminal-template">
  <div class="window terminal" data-title="Terminal">
    <div class="window-header">
      <span class="window-title">Terminal</span>
      <div class="window-controls">
        <button class="minimize">_</button>
        <button class="close">×</button>
      </div>
    </div>
    <div class="window-content">
      <div class="output">
        <p>HamzaOS v1.0</p>
        <p>Type <span class="cmd">help</span> to get started.</p>
      </div>
      <div class="input-line">
        <span class="prompt">hamza@portfolio:~$</span>
        <input type="text" class="command-input" />
      </div>
    </div>
  </div>
</template>

<!-- Taskbar -->
<div id="taskbar">
  <div id="tasks"></div>
  <div id="clock"></div>
</div>

<script src="script.js"></script>
</body>
</html>
